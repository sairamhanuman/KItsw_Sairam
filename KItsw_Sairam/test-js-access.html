<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test JavaScript Access</title>
</head>
<body>
    <h1>Testing JavaScript File Access</h1>
    
    <div id="results">
        <h2>Results:</h2>
        <div id="testResults">Testing...</div>
    </div>
    
    <script>
        // Test 1: Direct fetch of JavaScript file
        console.log('🔧 Testing direct file access...');
        
        fetch('js/internal-exam/generate-timetable-fresh.js?v=2026022250')
            .then(response => {
                console.log('🔧 Response status:', response.status);
                console.log('🔧 Response headers:', response.headers);
                console.log('🔧 Content type:', response.headers.get('content-type'));
                
                return response.text();
            })
            .then(content => {
                console.log('🔧 First 100 characters:', content.substring(0, 100));
                console.log('🔧 Content length:', content.length);
                
                // Check if it's JavaScript or HTML
                if (content.trim().startsWith('//') || content.trim().startsWith('/*') || content.trim().startsWith('var') || content.trim().startsWith('let') || content.trim().startsWith('function')) {
                    console.log('✅ Content appears to be JavaScript');
                    document.getElementById('testResults').innerHTML = `
                        <p>✅ JavaScript file loaded successfully!</p>
                        <p>Content length: ${content.length} characters</p>
                        <p>First 100 characters: ${content.substring(0, 100)}...</p>
                    `;
                } else {
                    console.log('❌ Content appears to be HTML');
                    document.getElementById('testResults').innerHTML = `
                        <p>❌ Content appears to be HTML, not JavaScript!</p>
                        <p>First 100 characters: ${content.substring(0, 100)}...</p>
                    `;
                }
            })
            .catch(error => {
                console.error('❌ Error loading JavaScript file:', error);
                document.getElementById('testResults').innerHTML = `
                    <p>❌ Error loading JavaScript file: ${error.message}</p>
                `;
            });
        
        // Test 2: Check if function exists after loading
        setTimeout(() => {
            console.log('🔧 Testing function availability...');
            
            // Try to load the script
            const script = document.createElement('script');
            script.src = 'js/internal-exam/generate-timetable-fresh.js?v=' + new Date().getTime();
            script.onload = function() {
                console.log('🔧 Script loaded successfully');
                
                // Check if function exists
                setTimeout(() => {
                    if (typeof generateInitialTimetable === 'function') {
                        console.log('✅ generateInitialTimetable function is available');
                        document.getElementById('testResults').innerHTML += '<p>✅ generateInitialTimetable function is available!</p>';
                    } else {
                        console.log('❌ generateInitialTimetable function NOT found');
                        document.getElementById('testResults').innerHTML += '<p>❌ generateInitialTimetable function NOT found!</p>';
                    }
                }, 1000);
            };
            script.onerror = function() {
                console.error('❌ Script failed to load');
                document.getElementById('testResults').innerHTML += '<p>❌ Script failed to load!</p>';
            };
            document.head.appendChild(script);
        }, 2000);
    </script>
</body>
</html>
