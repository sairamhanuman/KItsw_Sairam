<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Year Master</title>
<link rel="stylesheet" href="css/styles.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    font-size: 14px;
}

.page-wrap { max-width: 900px; margin: 30px auto; padding: 0 20px 40px; }

/* ── Header ── */
.page-header {
    background: linear-gradient(135deg, #1a237e, #3949ab);
    color: #fff;
    padding: 22px 28px;
    border-radius: 10px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 18px rgba(26,35,126,.25);
}
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header p  { font-size: 12px; opacity: .75; margin-top: 4px; }
.back-link {
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 6px;
    transition: background .2s;
}
.back-link:hover { background: rgba(255,255,255,.15); }

/* ── Alert ── */
.alert {
    display: none;
    padding: 11px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 500;
}
.alert-success { background: #e8f5e9; color: #1b5e20; border-left: 4px solid #4CAF50; }
.alert-error   { background: #ffebee; color: #b71c1c; border-left: 4px solid #f44336; }
.alert-warning { background: #fff8e1; color: #e65100; border-left: 4px solid #FFC107; }

/* ── Form Card ── */
.form-card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 28px;
    margin-bottom: 24px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
}
.form-card h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: #3949ab;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e8eaf6;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 14px;
    align-items: end;
}

.form-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #555;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: .5px;
}
.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #e0e0e0;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: #fafafa;
    transition: border-color .2s;
}
.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #3949ab;
    background: #fff;
}
.form-group input.error { border-color: #f44336; }

/* Checkboxes row */
.checks-row {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #f0f0f0;
}
.check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: #444;
}
.check-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: #3949ab;
}

/* Buttons */
.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}
.btn-primary { background: #3949ab; color: #fff; }
.btn-primary:hover { background: #283593; box-shadow: 0 2px 8px rgba(57,73,171,.35); }
.btn-secondary { background: #fff; color: #3949ab; border: 1.5px solid #3949ab; }
.btn-secondary:hover { background: #e8eaf6; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-danger { background: #e53935; color: #fff; }
.btn-danger:hover { background: #c62828; }
.btn-success { background: #43a047; color: #fff; }
.btn-success:hover { background: #2e7d32; }

/* ── Table Card ── */
.table-card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 28px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
}
.table-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.table-card-header h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: #3949ab;
}
.record-count {
    font-size: 12px;
    color: #888;
    background: #f0f2ff;
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 600;
}

.ay-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.ay-table thead tr { background: #1a237e; }
.ay-table th {
    color: #fff;
    padding: 11px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
}
.ay-table td {
    padding: 11px 14px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
}
.ay-table tr:hover td { background: #f8f9ff; }
.ay-table tr:last-child td { border-bottom: none; }

/* Badges */
.badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .3px;
}
.badge-even    { background: #e3f2fd; color: #1565c0; }
.badge-odd     { background: #f3e5f5; color: #6a1b9a; }
.badge-both    { background: #e8f5e9; color: #1b5e20; }
.badge-current { background: #fff9c4; color: #f57f17; border: 1px solid #f9a825; }
.badge-active  { background: #e8f5e9; color: #2e7d32; }
.badge-inactive{ background: #fce4ec; color: #880e4f; }

/* Empty state */
.empty-state {
    text-align: center;
    padding: 48px 20px;
    color: #aaa;
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
</style>
</head>
<body>

<div class="page-wrap">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>🗓 Academic Year Master</h1>
            <p>Manage academic years and semester types</p>
        </div>
        <a href="index.html" class="back-link">← Back to Dashboard</a>
    </div>

    <!-- Alert -->
    <div id="alert-box" class="alert"></div>

    <!-- Form Card -->
    <div class="form-card">
        <h3 id="form-title">➕ Add New Academic Year</h3>

        <div class="form-grid">
            <div class="form-group">
                <label>Academic Year *</label>
                <input type="text" id="ay-input" placeholder="e.g. 2025-26" maxlength="7">
            </div>
            <div class="form-group">
                <label>Semester Type *</label>
                <select id="semtype-input">
                    <option value="Both">Both (Even + Odd)</option>
                    <option value="Even">Even Only</option>
                    <option value="Odd">Odd Only</option>
                </select>
            </div>
            <div class="form-group" style="display:flex;align-items:flex-end;gap:10px">
                <button class="btn btn-primary" onclick="saveAY()">
                    <span id="save-btn-text">💾 Save</span>
                </button>
                <button class="btn btn-secondary" onclick="cancelEdit()">✕ Cancel</button>
            </div>
        </div>

        <div class="checks-row">
            <label class="check-item">
                <input type="checkbox" id="is-current-input">
                ⭐ Mark as Current Academic Year
            </label>
            <label class="check-item">
                <input type="checkbox" id="is-active-input" checked>
                ✅ Active
            </label>
        </div>
    </div>

    <!-- Table Card -->
    <div class="table-card">
        <div class="table-card-header">
            <h3>📋 All Academic Years</h3>
            <span class="record-count" id="record-count">0 records</span>
        </div>

        <div id="table-container">
            <div class="empty-state">
                <div class="empty-icon">📅</div>
                <p>Loading academic years...</p>
            </div>
        </div>
    </div>

</div>

<script>
let editingId = null;

// ── Load table on page load ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', loadAcademicYears);

// ── Auto-format input: type 2025 → auto add hyphen → 2025- ───────────────────
document.getElementById('ay-input').addEventListener('input', function () {
    let val = this.value.replace(/[^0-9-]/g, '');
    if (val.length === 4 && !val.includes('-')) val += '-';
    this.value = val;
});

// ── Load All ──────────────────────────────────────────────────────────────────
async function loadAcademicYears() {
    try {
        const res  = await fetch('/api/academic-years/all');
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        renderTable(data.data);
    } catch (err) {
        showAlert('Failed to load: ' + err.message, 'error');
    }
}

// ── Render Table ──────────────────────────────────────────────────────────────
function renderTable(rows) {
    document.getElementById('record-count').textContent = `${rows.length} record${rows.length !== 1 ? 's' : ''}`;

    if (rows.length === 0) {
        document.getElementById('table-container').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📅</div>
                <p>No academic years added yet. Use the form above to add one.</p>
            </div>`;
        return;
    }

    let html = `
    <table class="ay-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Academic Year</th>
                <th>Semester Type</th>
                <th>Current</th>
                <th>Status</th>
                <th style="text-align:center">Actions</th>
            </tr>
        </thead>
        <tbody>`;

    rows.forEach((row, i) => {
        const semBadge = row.semester_type === 'Even'
            ? `<span class="badge badge-even">Even</span>`
            : row.semester_type === 'Odd'
            ? `<span class="badge badge-odd">Odd</span>`
            : `<span class="badge badge-both">Both</span>`;

        const currentBadge = row.is_current
            ? `<span class="badge badge-current">⭐ Current</span>`
            : `<span style="color:#ccc;font-size:12px">—</span>`;

        const statusBadge = row.is_active
            ? `<span class="badge badge-active">Active</span>`
            : `<span class="badge badge-inactive">Inactive</span>`;

        html += `
        <tr>
            <td style="color:#aaa;font-size:12px">${i + 1}</td>
            <td style="font-weight:700;font-size:15px;font-family:'Courier New',monospace;letter-spacing:1px">
                ${row.academic_year}
            </td>
            <td>${semBadge}</td>
            <td>${currentBadge}</td>
            <td>${statusBadge}</td>
            <td style="text-align:center;white-space:nowrap">
                ${!row.is_current ? `
                <button class="btn btn-success btn-sm"
                        onclick="setCurrentAY(${row.academic_year_id}, '${row.academic_year}')"
                        title="Set as current">⭐</button>` : ''}
                <button class="btn btn-secondary btn-sm"
                        onclick="editAY(${row.academic_year_id})"
                        title="Edit">✏ Edit</button>
                ${row.is_active ? `
                <button class="btn btn-danger btn-sm"
                        onclick="deleteAY(${row.academic_year_id}, '${row.academic_year}')"
                        title="Deactivate">🗑</button>` : ''}
            </td>
        </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('table-container').innerHTML = html;
}

// ── Save (Create or Update) ───────────────────────────────────────────────────
async function saveAY() {
    const ayVal   = document.getElementById('ay-input').value.trim();
    const semType = document.getElementById('semtype-input').value;
    const isCurr  = document.getElementById('is-current-input').checked ? 1 : 0;
    const isAct   = document.getElementById('is-active-input').checked  ? 1 : 0;

    // Validate
    if (!ayVal) {
        document.getElementById('ay-input').classList.add('error');
        showAlert('Please enter an Academic Year (e.g. 2025-26)', 'warning');
        return;
    }
    if (!/^\d{4}-\d{2}$/.test(ayVal)) {
        document.getElementById('ay-input').classList.add('error');
        showAlert('Format must be YYYY-YY — example: 2025-26', 'warning');
        return;
    }
    document.getElementById('ay-input').classList.remove('error');

    const body = { academic_year: ayVal, semester_type: semType, is_current: isCurr, is_active: isAct };
    const url    = editingId ? `/api/academic-years/${editingId}` : '/api/academic-years';
    const method = editingId ? 'PUT' : 'POST';

    try {
        const res  = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        showAlert(editingId ? '✅ Academic Year updated!' : '✅ Academic Year added!', 'success');
        resetForm();
        loadAcademicYears();
    } catch (err) {
        showAlert('Error: ' + err.message, 'error');
    }
}

// ── Edit ──────────────────────────────────────────────────────────────────────
async function editAY(id) {
    try {
        const res  = await fetch('/api/academic-years/all');
        const data = await res.json();
        const row  = data.data.find(r => r.academic_year_id === id);
        if (!row) return;

        editingId = id;
        document.getElementById('ay-input').value         = row.academic_year;
        document.getElementById('semtype-input').value    = row.semester_type;
        document.getElementById('is-current-input').checked = row.is_current === 1;
        document.getElementById('is-active-input').checked  = row.is_active  === 1;

        document.getElementById('form-title').textContent    = `✏ Edit Academic Year — ${row.academic_year}`;
        document.getElementById('save-btn-text').textContent = '💾 Update';

        // Scroll to form
        document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
        showAlert(`Editing ${row.academic_year} — make changes and click Update`, 'warning');
    } catch (err) {
        showAlert('Failed to load record: ' + err.message, 'error');
    }
}

// ── Set Current ───────────────────────────────────────────────────────────────
async function setCurrentAY(id, ayName) {
    if (!confirm(`Set "${ayName}" as the current academic year?\nThis will unset all other current flags.`)) return;
    try {
        const res  = await fetch(`/api/academic-years/${id}/set-current`, { method: 'PATCH' });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        showAlert(`⭐ "${ayName}" is now the current academic year`, 'success');
        loadAcademicYears();
    } catch (err) {
        showAlert('Error: ' + err.message, 'error');
    }
}

// ── Delete (soft) ─────────────────────────────────────────────────────────────
async function deleteAY(id, ayName) {
    if (!confirm(`Deactivate "${ayName}"?\nIt will be hidden from dropdowns but data is preserved.`)) return;
    try {
        const res  = await fetch(`/api/academic-years/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        showAlert(`"${ayName}" deactivated successfully`, 'success');
        loadAcademicYears();
    } catch (err) {
        showAlert('Error: ' + err.message, 'error');
    }
}

// ── Cancel Edit ───────────────────────────────────────────────────────────────
function cancelEdit() {
    resetForm();
    showAlert('Edit cancelled', 'warning');
}

function resetForm() {
    editingId = null;
    document.getElementById('ay-input').value              = '';
    document.getElementById('semtype-input').value         = 'Both';
    document.getElementById('is-current-input').checked    = false;
    document.getElementById('is-active-input').checked     = true;
    document.getElementById('form-title').textContent      = '➕ Add New Academic Year';
    document.getElementById('save-btn-text').textContent   = '💾 Save';
    document.getElementById('ay-input').classList.remove('error');
}

// ── Alert helper ──────────────────────────────────────────────────────────────
function showAlert(msg, type = 'success') {
    const el = document.getElementById('alert-box');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
}
</script>
</body>
</html>
