<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>JavaScript Error Test</h2>
        <button onclick="testEdit()" class="btn btn-primary">Test Edit Function</button>
        <button onclick="testGenerate()" class="btn btn-success">Test Generate Function</button>
        <div id="testOutput"></div>
    </div>

    <script>
        // Test data
        const testNotifications = [
            {notification_id: 1, programme_name: 'CSE', exam_type: 'Internal', exam_name: 'Mid Term', exam_start_date: '2024-03-01', exam_end_date: '2024-03-15'}
        ];

        function testEdit() {
            try {
                const notification = testNotifications.find(n => n.notification_id === 1);
                const output = document.getElementById('testOutput');
                
                // Test with null checks
                const editProgramme = document.getElementById('editProgramme');
                if (editProgramme) {
                    editProgramme.value = notification.programme_id || '';
                    output.innerHTML += '<div class="alert alert-success">Edit function works!</div>';
                } else {
                    output.innerHTML += '<div class="alert alert-warning">Edit element not found</div>';
                }
            } catch (error) {
                document.getElementById('testOutput').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        function testGenerate() {
            try {
                const notification = testNotifications.find(n => n.notification_id === 1);
                const output = document.getElementById('testOutput');
                output.innerHTML += `<div class="alert alert-info">Generating timetable for ${notification.notification_title || 'Untitled'}</div>`;
            } catch (error) {
                document.getElementById('testOutput').innerHTML += `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
