<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invigilation — Admin View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#0f172a;font-family:'Segoe UI',sans-serif;min-height:100vh;color:#e2e8f0;}

        /* PIN OVERLAY */
        .pin-overlay{position:fixed;inset:0;background:rgba(15,23,42,.97);display:flex;
            align-items:center;justify-content:center;z-index:9999;}
        .pin-box{background:#1e293b;border:1.5px solid #334155;border-radius:20px;
            padding:40px;width:340px;text-align:center;}
        .pin-box h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
        .pin-box p{font-size:13px;color:#94a3b8;margin-bottom:24px;}
        .pin-input{width:100%;padding:14px;background:#0f172a;border:2px solid #334155;
            border-radius:12px;color:#fff;font-size:24px;text-align:center;letter-spacing:8px;
            outline:none;transition:border-color .2s;}
        .pin-input:focus{border-color:#667eea;}
        .pin-input.error{border-color:#dc2626;animation:shake .4s;}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        .pin-btn{width:100%;margin-top:16px;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);
            color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}

        /* HEADER */
        .page-hdr{background:linear-gradient(135deg,#1e293b,#0f172a);padding:14px 20px;
            display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;}
        .page-hdr h1{font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;}
        .session-badge{background:#16a34a;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
        .session-badge.waiting{background:#f59e0b;}
        .session-badge.ended{background:#64748b;}

        /* STATUS BANNER */
        .status-banner{padding:16px 20px;text-align:center;}
        .banner-waiting{background:#1e293b;border:1px solid #f59e0b;border-radius:12px;
            padding:24px;color:#fef3c7;margin:20px;}
        .banner-ended{background:#1e293b;border:1px solid #64748b;border-radius:12px;
            padding:24px;color:#94a3b8;margin:20px;}

        /* CLOCK */
        .live-clock{font-size:13px;color:#64748b;font-weight:600;}

        /* MAIN */
        .main{padding:16px 20px;max-width:1400px;margin:0 auto;}

        /* BLOCK TABS */
        .block-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
        .block-tab{padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;
            cursor:pointer;border:1.5px solid #334155;color:#94a3b8;background:#1e293b;
            transition:all .2s;}
        .block-tab.active{background:linear-gradient(135deg,#667eea,#764ba2);
            border-color:transparent;color:#fff;}
        .block-tab:hover:not(.active){border-color:#667eea;color:#a5b4fc;}

        /* ROOM GRID */
        .rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;
            margin-bottom:20px;}
        .room-card{background:#1e293b;border:1.5px solid #334155;border-radius:12px;
            padding:12px;cursor:pointer;transition:all .2s;text-align:center;}
        .room-card:hover{border-color:#667eea;transform:translateY(-2px);}
        .room-card.active{border-color:#667eea;background:#1e3a5f;}
        .room-card.submitted{border-color:#16a34a;background:#14532d22;}
        .room-card .rc-num{font-weight:800;font-size:13px;color:#e2e8f0;}
        .room-card .rc-count{font-size:11px;color:#64748b;margin-top:3px;}
        .room-card .rc-status{font-size:10px;margin-top:4px;font-weight:700;}
        .room-card.submitted .rc-status{color:#16a34a;}
        .room-card:not(.submitted) .rc-status{color:#f59e0b;}
        .room-card.pending{animation:pulse-pending 1.8s ease-in-out infinite;}
        @keyframes pulse-pending{
            0%,100%{border-color:#f59e0b;box-shadow:none;}
            50%{border-color:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.5);}
        }

        /* STUDENT TABLE PANEL */
        .student-panel{background:#1e293b;border:1.5px solid #334155;border-radius:14px;overflow:hidden;}
        .panel-hdr{padding:14px 20px;background:#0f172a;display:flex;align-items:center;
            justify-content:space-between;flex-wrap:wrap;gap:10px;}
        .panel-hdr h3{font-size:15px;font-weight:700;color:#fff;margin:0;}
        .panel-meta{font-size:12px;color:#64748b;}

        /* Mark all */
        .mark-all-row{padding:10px 20px;background:#0f172a;border-bottom:1px solid #1e293b;
            display:flex;gap:10px;align-items:center;}
        .mark-btn{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;
            cursor:pointer;border:1.5px solid;transition:all .15s;}
        .mark-present{border-color:#16a34a;color:#16a34a;background:transparent;}
        .mark-present:hover{background:#16a34a;color:#fff;}
        .mark-absent{border-color:#dc2626;color:#dc2626;background:transparent;}
        .mark-absent:hover{background:#dc2626;color:#fff;}

        .std-table{width:100%;border-collapse:collapse;font-size:13px;}
        .std-table th{background:#0f172a;color:#64748b;padding:10px 12px;font-weight:600;
            font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;
            border-bottom:1px solid #334155;}
        .std-table td{padding:8px 12px;border-bottom:1px solid #1e3a5f;vertical-align:middle;}
        .std-table tr:last-child td{border-bottom:none;}
        .std-table tr.absent-row td{background:#1a0000;}
        .std-table tr:hover td{background:#243554;}

        .photo-cell img{width:44px;height:44px;border-radius:8px;object-fit:cover;
            border:2px solid #334155;}
        .photo-cell .no-photo{width:44px;height:44px;border-radius:8px;background:#334155;
            display:flex;align-items:center;justify-content:center;color:#64748b;font-size:18px;}

        /* Present/Absent toggle */
        .att-toggle{display:flex;gap:0;border-radius:20px;overflow:hidden;border:1.5px solid #334155;}
        .att-btn{padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;border:none;
            background:transparent;color:#64748b;transition:all .15s;}
        .att-btn.present.active{background:#16a34a;color:#fff;}
        .att-btn.absent.active{background:#dc2626;color:#fff;}
        .att-btn:hover:not(.active){background:#334155;color:#e2e8f0;}

        /* Submit area */
        .submit-area{padding:16px 20px;background:#0f172a;border-top:1px solid #334155;}
        .absent-preview{background:#1a0000;border:1px solid #dc262644;border-radius:10px;
            padding:12px 16px;margin-bottom:12px;font-size:12px;color:#fca5a5;line-height:1.8;}
        .absent-preview strong{color:#dc2626;display:block;margin-bottom:4px;}
        .stats-row{display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap;}
        .stat-item{font-size:13px;color:#64748b;}
        .stat-item strong{font-size:16px;font-weight:800;}
        .stat-item.total strong{color:#6366f1;}
        .stat-item.present strong{color:#16a34a;}
        .stat-item.absent strong{color:#dc2626;}
        .submit-btn{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;
            border-radius:12px;padding:12px 32px;font-size:14px;font-weight:700;cursor:pointer;
            transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
        .submit-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(22,163,74,.4);}
        .submit-btn:disabled{opacity:.5;pointer-events:none;}
        .version-tag{font-size:11px;color:#64748b;margin-left:8px;}

        /* Toast */
        .toast-c{position:fixed;top:16px;right:16px;z-index:9998;}
        .toast-m{background:#1e293b;border-left:4px solid #16a34a;color:#e2e8f0;
            padding:10px 16px;border-radius:10px;font-size:13px;margin-bottom:6px;
            box-shadow:0 4px 16px rgba(0,0,0,.4);animation:slideIn .3s ease;}
        @keyframes slideIn{from{transform:translateX(120%)}to{transform:translateX(0)}}
    </style>
</head>
<body>

<!-- PIN OVERLAY -->
<div class="pin-overlay" id="pinOverlay">
    <div class="pin-box">
        <div style="font-size:40px;margin-bottom:12px;">🔐</div>
        <h2>Invigilation Login</h2>
        <p>Enter the invigilation PIN to proceed</p>
        <input type="password" id="pinInput" class="pin-input" maxlength="6"
               placeholder="••••" onkeydown="if(event.key==='Enter') verifyPin()"/>
        <button class="pin-btn" onclick="verifyPin()">
            <i class="bi bi-unlock-fill me-2"></i>Enter
        </button>
        <div id="pinError" style="color:#dc2626;font-size:12px;margin-top:10px;display:none;">
            ❌ Invalid PIN. Try again.
        </div>
    </div>
</div>

<!-- HEADER -->
<div class="page-hdr">
    <h1>
        <i class="bi bi-clipboard2-check-fill" style="color:#a5b4fc;"></i>
        Invigilation — Admin View
    </h1>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <input type="date" id="adminDate" style="padding:6px 10px;border-radius:8px;
            border:1.5px solid #334155;background:#1e293b;color:#e2e8f0;font-size:12px;outline:none;"
            onchange="adminLoad()"/>
        <select id="adminSession" style="padding:6px 10px;border-radius:8px;
            border:1.5px solid #334155;background:#1e293b;color:#e2e8f0;font-size:12px;outline:none;"
            onchange="adminLoad()">
            <option value="">— Session —</option>
            <option value="1">FN</option>
            <option value="2">AN</option>
        </select>
        <span class="live-clock" id="liveClock"></span>
        <span class="session-badge" id="sessionBadge" style="display:none;"></span>
        <a href="index.html" style="color:#64748b;font-size:12px;text-decoration:none;">← Dashboard</a>
    </div>
</div>

<div class="toast-c" id="toastC"></div>

<!-- STATUS / MAIN -->
<div id="statusArea">
    <div style="text-align:center;padding:60px;color:#64748b;">
        <div class="spinner-border text-primary mb-3"></div>
        <div>Checking session timing…</div>
    </div>
</div>

<div class="main" id="mainArea" style="display:none;">

    <!-- Block tabs -->
    <div class="block-tabs" id="blockTabs"></div>

    <!-- Pending summary bar -->
    <div id="pendingBar" style="display:none;background:#1a0f00;border:1.5px solid #f59e0b;
        border-radius:12px;padding:12px 16px;margin-bottom:14px;cursor:pointer;"
        onclick="togglePendingPanel()">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:16px;">⚠️</span>
                <span style="font-weight:700;color:#fbbf24;font-size:13px;">
                    Attendance not submitted —
                    <span id="pendingCount">0</span> room(s) pending
                </span>
            </div>
            <span id="pendingArrow" style="color:#f59e0b;font-size:12px;">▼ Show rooms</span>
        </div>
        <div id="pendingPanel" style="display:none;margin-top:10px;padding-top:10px;
            border-top:1px solid #f59e0b33;">
            <div id="pendingRoomList" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>
    </div>

    <!-- Rooms grid -->
    <div class="rooms-grid" id="roomsGrid"></div>

    <!-- Student panel -->
    <div class="student-panel" id="studentPanel" style="display:none;">
        <div class="panel-hdr">
            <div>
                <h3 id="panelTitle">Room —</h3>
                <div class="panel-meta" id="panelMeta"></div>
            </div>
            <button onclick="closePanel()"
                style="background:#334155;border:none;color:#94a3b8;border-radius:8px;
                       padding:6px 12px;cursor:pointer;font-size:12px;">
                ✕ Close
            </button>
        </div>
        <div class="mark-all-row">
            <span style="font-size:12px;color:#64748b;margin-right:4px;">Mark all:</span>
            <button class="mark-btn mark-present" onclick="markAll('Present')">✅ All Present</button>
            <button class="mark-btn mark-absent" onclick="markAll('Absent')">❌ All Absent</button>
        </div>
        <div style="overflow-x:auto;">
            <table class="std-table">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Sem</th>
                        <th>Branch</th>
                        <th>Roll No</th>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Sub Code</th>
                        <th>Subject</th>
                        <th>Attendance</th>
                    </tr>
                </thead>
                <tbody id="studentTbody"></tbody>
            </table>
        </div>
        <div class="submit-area">
            <div class="absent-preview" id="absentPreview" style="display:none;"></div>
            <div class="stats-row" id="statsRow"></div>
            <button class="submit-btn" id="submitBtn" onclick="submitAttendance()">
                <i class="bi bi-send-check-fill"></i> Submit Attendance
            </button>
            <span class="version-tag" id="versionTag"></span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

// ── State ─────────────────────────────────────────────────────
const S = {
    date: null, session: null, sessionName: '',
    blocks: [], activeBlock: null,
    currentRoom: null, currentPlanId: null,
    students: [], attendance: {}
};

// ── Clock ─────────────────────────────────────────────────────
function startClock() {
    function tick() {
        const now = new Date();
        document.getElementById('liveClock').textContent =
            now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }
    tick(); setInterval(tick, 1000);
}

// ── PIN ───────────────────────────────────────────────────────
async function verifyPin() {
    const pin = document.getElementById('pinInput').value;
    if (!pin) return;
    try {
        const res  = await fetch('/api/invigilation/verify-pin', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ pin })
        });
        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem('invigilation_auth', '1');
            document.getElementById('pinOverlay').style.display = 'none';
            init();
        } else {
            const inp = document.getElementById('pinInput');
            inp.classList.add('error');
            document.getElementById('pinError').style.display = 'block';
            inp.value = '';
            setTimeout(() => inp.classList.remove('error'), 600);
        }
    } catch(e) { toast('Server error: ' + e.message, 'error'); }
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
    startClock();
    // Set default date to today
    const today = new Date();
    document.getElementById('adminDate').value =
        `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    document.getElementById('statusArea').innerHTML =
        `<div style="text-align:center;padding:40px;color:#64748b;">
            Select a date and session above to load rooms.
         </div>`;
}

async function adminLoad() {
    const date = document.getElementById('adminDate').value;
    const sess = document.getElementById('adminSession').value;
    if (!date || !sess) return;

    const sessNames = { '1':'FN', '2':'AN' };
    S.date        = date;
    S.session     = parseInt(sess);
    S.sessionName = sessNames[sess] || sess;

    document.getElementById('sessionBadge').textContent = `${S.sessionName} — ${date}`;
    document.getElementById('sessionBadge').style.display = 'inline-flex';
    document.getElementById('sessionBadge').className = 'session-badge';
    document.getElementById('statusArea').style.display = 'none';
    document.getElementById('mainArea').style.display   = 'block';
    closePanel();
    await loadRooms();
}

// ── Load rooms ────────────────────────────────────────────────
async function loadRooms() {
    try {
        const res  = await fetch(`/api/invigilation/rooms?exam_date=${S.date}&session_order=${S.session}`);
        const data = await res.json();
        S.blocks = data.blocks || [];

        if (!S.blocks.length) {
            document.getElementById('mainArea').innerHTML = `
                <div style="text-align:center;padding:60px;color:#64748b;">
                    <i class="bi bi-building-x" style="font-size:48px;display:block;margin-bottom:12px;"></i>
                    No seating plan found for today's session.<br>
                    <span style="font-size:12px;">Please generate and confirm a seating plan first.</span>
                </div>`;
            return;
        }

        renderBlockTabs();
        S.activeBlock = S.blocks[0].block_code;
        renderRooms();

    } catch(e) { toast('Error loading rooms: ' + e.message, 'error'); }
}

function renderBlockTabs() {
    document.getElementById('blockTabs').innerHTML = S.blocks.map(b => `
        <div class="block-tab ${S.activeBlock === b.block_code ? 'active' : ''}"
             onclick="switchBlock('${b.block_code}')">
            ${b.block_code}
            <span style="font-size:10px;opacity:.7;margin-left:4px;">(${b.rooms.length})</span>
        </div>`).join('');
}

function switchBlock(code) {
    S.activeBlock = code;
    renderBlockTabs();
    renderRooms();
    closePanel();
}

function renderRooms() {
    const blk = S.blocks.find(b => b.block_code === S.activeBlock);
    if (!blk) return;

    // Update pending summary bar (all blocks, not just active)
    const allRooms    = S.blocks.flatMap(b => b.rooms);
    const pendingRooms = allRooms.filter(r => !r.is_submitted);
    const pendingBar  = document.getElementById('pendingBar');
    if (pendingBar) {
        if (pendingRooms.length > 0) {
            pendingBar.style.display = 'block';
            document.getElementById('pendingCount').textContent = pendingRooms.length;
            document.getElementById('pendingRoomList').innerHTML = pendingRooms.map(r =>
                `<span onclick="event.stopPropagation();switchToRoom(${r.room_id},${r.plan_id},'${r.room_number}',${r.student_count})"
                    style="background:#f59e0b;color:#000;padding:4px 10px;border-radius:8px;
                           font-size:11px;font-weight:700;cursor:pointer;">${r.room_number}</span>`
            ).join('');
        } else {
            pendingBar.style.display = 'none';
        }
    }

    document.getElementById('roomsGrid').innerHTML = blk.rooms.map(r => {
        const sub = r.is_submitted
            ? `<div class="rc-status">✅ Submitted v${r.last_version}</div>`
            : `<div class="rc-status">⚠ Pending</div>`;
        return `
        <div class="room-card ${r.is_submitted ? 'submitted' : 'pending'} ${S.currentRoom?.room_id === r.room_id ? 'active' : ''}"
             onclick="openRoom(${r.room_id}, '${r.room_number}', ${r.plan_id}, ${r.student_count})">
            <div class="rc-num">${r.room_number}</div>
            <div class="rc-count"><i class="bi bi-people"></i> ${r.student_count}</div>
            ${sub}
        </div>`;
    }).join('');
}

// ── Open room ─────────────────────────────────────────────────
async function openRoom(roomId, roomNumber, planId, count) {
    S.currentRoom   = { room_id:roomId, room_number:roomNumber };
    S.currentPlanId = planId;

    renderRooms();

    document.getElementById('panelTitle').textContent = `Room: ${roomNumber}`;
    document.getElementById('panelMeta').textContent  = `${count} students · ${S.date} ${S.sessionName}`;
    document.getElementById('studentPanel').style.display = 'block';
    document.getElementById('studentPanel').scrollIntoView({ behavior:'smooth', block:'start' });
    document.getElementById('studentTbody').innerHTML =
        `<tr><td colspan="9" style="text-align:center;padding:30px;color:#64748b;">
            <div class="spinner-border spinner-border-sm me-2"></div>Loading students…
         </td></tr>`;

    try {
        const res  = await fetch(
            `/api/invigilation/students/${planId}/${roomId}` +
            `?exam_date=${S.date}&session_order=${S.session}`
        );
        const data = await res.json();
        S.students   = data.students || [];
        S.attendance = {};
        S.students.forEach(s => { S.attendance[s.student_id] = s.attendance_status || 'Present'; });

        renderStudentTable();
        updateStats();

    } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function closePanel() {
    document.getElementById('studentPanel').style.display = 'none';
    S.currentRoom = null;
}

function togglePendingPanel() {
    const panel = document.getElementById('pendingPanel');
    const arrow = document.getElementById('pendingArrow');
    const show  = panel.style.display === 'none';
    panel.style.display = show ? 'block' : 'none';
    arrow.textContent   = show ? '▲ Hide rooms' : '▼ Show rooms';
}

function switchToRoom(roomId, planId, roomNumber, count) {
    // Find which block this room is in and switch to it
    for (const blk of S.blocks) {
        if (blk.rooms.find(r => r.room_id === roomId)) {
            S.activeBlock = blk.block_code;
            renderBlockTabs();
            renderRooms();
            break;
        }
    }
    openRoom(roomId, roomNumber, planId, count);
    // Close pending panel
    document.getElementById('pendingPanel').style.display = 'none';
    document.getElementById('pendingArrow').textContent   = '▼ Show rooms';
}

// ── Render student table ──────────────────────────────────────
function renderStudentTable() {
    const tbody = document.getElementById('studentTbody');
    if (!S.students.length) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:30px;color:#64748b;">
            No students found</td></tr>`;
        return;
    }

    tbody.innerHTML = S.students.map((s, i) => {
        const att    = S.attendance[s.student_id] || 'Present';
        const isAbs  = att === 'Absent';
        const photoUrl = (() => {
            const match = s.roll_no.match(/^[A-Z](\d{2})/);
            const yr    = match ? match[1] : '24';
            return `https://kitsw.ac.in/academics/B.Tech.%20I%20Yr%20URR${yr}/${s.roll_no}.jpg`;
        })();
        const secLbl  = s.section_name ? s.section_name.replace('Sec-','') : '';
        const brLbl   = s.branch_code + (secLbl ? `-${secLbl}` : '');

        return `<tr class="${isAbs ? 'absent-row' : ''}" id="row_${s.student_id}">
            <td style="color:#64748b;font-size:12px;">${i+1}</td>
            <td style="font-size:12px;">${s.semester_name||'—'}</td>
            <td style="font-size:12px;font-weight:600;">${brLbl}</td>
            <td style="font-weight:700;color:#a5b4fc;">${s.roll_no}</td>
            <td class="photo-cell">
                <img src="${photoUrl}" alt="${s.roll_no}"
                     onerror="this.outerHTML='<div class=no-photo><i class=bi.bi-person-fill></i></div>'"
                     width="44" height="44"/>
            </td>
            <td style="font-size:12px;">${s.student_name}</td>
            <td style="font-size:12px;color:#667eea;font-weight:600;">${s.subject_code||'—'}</td>
            <td style="font-size:11px;color:#64748b;">${(s.subject_name||'').substring(0,30)}</td>
            <td>
                <div class="att-toggle">
                    <button class="att-btn present ${att==='Present'?'active':''}"
                        onclick="toggleAtt(${s.student_id},'Present')">Present</button>
                    <button class="att-btn absent ${att==='Absent'?'active':''}"
                        onclick="toggleAtt(${s.student_id},'Absent')">Absent</button>
                </div>
            </td>
        </tr>`;
    }).join('');
}

function toggleAtt(studentId, status) {
    S.attendance[studentId] = status;
    const row = document.getElementById(`row_${studentId}`);
    if (row) {
        row.className = status === 'Absent' ? 'absent-row' : '';
        row.querySelectorAll('.att-btn').forEach(b => {
            b.classList.toggle('active', b.classList.contains(status.toLowerCase()));
        });
    }
    updateStats();
}

function markAll(status) {
    S.students.forEach(s => { S.attendance[s.student_id] = status; });
    renderStudentTable();
    updateStats();
}

function updateStats() {
    const total   = S.students.length;
    const absent  = Object.values(S.attendance).filter(v => v === 'Absent').length;
    const present = total - absent;
    const absRolls = S.students
        .filter(s => S.attendance[s.student_id] === 'Absent')
        .map(s => s.roll_no);

    document.getElementById('statsRow').innerHTML = `
        <div class="stat-item total"><strong>${total}</strong> Total</div>
        <div class="stat-item present"><strong>${present}</strong> Present</div>
        <div class="stat-item absent"><strong>${absent}</strong> Absent</div>`;

    const prev = document.getElementById('absentPreview');
    if (absent > 0) {
        prev.style.display = 'block';
        prev.innerHTML = `<strong>Absent Roll No(s):</strong> ${absRolls.join(', ')}`;
    } else {
        prev.style.display = 'none';
    }
}

// ── Submit ────────────────────────────────────────────────────
async function submitAttendance() {
    document.getElementById('submitBtn').disabled = true;

    try {
        const entries = S.students.map(s => ({
            student_id:   s.student_id,
            roll_no:      s.roll_no,
            subject_id:   s.subject_id,
            subject_code: s.subject_code,
            branch_id:    s.branch_id,
            semester_id:  s.semester_id,
            status:       S.attendance[s.student_id] || 'Present'
        }));

        const res  = await fetch('/api/invigilation/submit', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                plan_id:       S.currentPlanId,
                room_id:       S.currentRoom.room_id,
                exam_date:     S.date,
                session_order: S.session,
                entries,
                submitted_by:  'Invigilator'
            })
        });
        const data = await res.json();

        if (data.success) {
            document.getElementById('versionTag').textContent = `Submission v${data.version}`;
            toast(`✅ Submitted v${data.version} — ${data.absent} absent`, 'success');
            // Mark room as submitted
            await loadRooms();
            Swal.fire({
                title:'Submitted!',
                html:`<div>
                    Total: <b>${data.total}</b> | Present: <b style="color:#16a34a">${data.present}</b> |
                    Absent: <b style="color:#dc2626">${data.absent}</b><br>
                    ${data.absent_rolls.length ? '<br>Absent: '+data.absent_rolls.join(', ') : ''}
                </div>`,
                icon:'success', background:'#1e293b', color:'#e2e8f0',
                confirmButtonColor:'#16a34a'
            });
        } else { throw new Error(data.error); }

    } catch(e) {
        toast('Submit failed: ' + e.message, 'error');
    } finally {
        document.getElementById('submitBtn').disabled = false;
    }
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, type='success') {
    const colors = { success:'#16a34a', error:'#dc2626', warning:'#f59e0b', info:'#6366f1' };
    const el = document.createElement('div');
    el.className = 'toast-m';
    el.style.borderLeftColor = colors[type] || '#667eea';
    el.textContent = msg;
    document.getElementById('toastC').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

// ── Boot ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('invigilation_auth') === '1') {
        document.getElementById('pinOverlay').style.display = 'none';
        init();
    }
    document.getElementById('pinInput').focus();
});
</script>
</body>
