<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tab-pane {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tab-pane.active {
            display: block;
            opacity: 1;
        }
        .tab-pane.show {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Tab Visibility Test</h1>
        
        <ul class="nav nav-tabs" id="testTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab1-tab" data-bs-toggle="tab" data-bs-target="#tab1" type="button" role="tab">
                    Tab 1
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab2-tab" data-bs-toggle="tab" data-bs-target="#tab2" type="button" role="tab">
                    Tab 2
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab3-tab" data-bs-toggle="tab" data-bs-target="#tab3" type="button" role="tab">
                    Tab 3
                </button>
            </li>
        </ul>

        <div class="tab-content" id="testTabContent">
            <div class="tab-pane fade show active" id="tab1" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-body">
                        <h5>Tab 1 Content</h5>
                        <p>This is the content for Tab 1. It should be visible by default.</p>
                    </div>
                </div>
            </div>
            
            <div class="tab-pane fade" id="tab2" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-body">
                        <h5>Tab 2 Content</h5>
                        <p>This is the content for Tab 2. It should appear when Tab 2 is clicked.</p>
                    </div>
                </div>
            </div>
            
            <div class="tab-pane fade" id="tab3" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-body">
                        <h5>Tab 3 Content</h5>
                        <p>This is the content for Tab 3. It should appear when Tab 3 is clicked.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
