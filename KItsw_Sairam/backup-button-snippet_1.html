<!-- ============================================================
  BACKUP BUTTON  –  Paste this inside your existing HTML page
  Suggested location: inside .header-actions div, before logout button
  ============================================================ -->

<!-- 1.  Button in the header (paste before logout-btn) -->
<button class="backup-btn" id="backup-btn" onclick="takeManualBackup()">
    💾 Backup DB
</button>

<!-- 2.  Backup result toast (paste just before </body>) -->
<div id="backup-toast" style="
    display:none;
    position:fixed;
    top:18px;
    right:22px;
    z-index:9999;
    padding:14px 20px;
    border-radius:8px;
    font-size:14px;
    color:#fff;
    max-width:340px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    transition:opacity .4s;
"></div>

<!-- 3.  Backup history panel (paste anywhere inside .content-area or body) -->
<div id="backup-panel" style="display:none; margin:20px;">
    <div style="background:#fff; border-radius:12px; border:2px solid #ccc; padding:24px; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 style="margin:0; color:#004d40;">📁 Backup History  –  E:\Backup</h3>
            <button onclick="document.getElementById('backup-panel').style.display='none'"
                style="background:none; border:1px solid #ccc; border-radius:6px; padding:6px 12px; cursor:pointer;">✕ Close</button>
        </div>
        <div id="backup-list">Loading...</div>
    </div>
</div>

<!-- 4.  Styles (paste inside your <style> block) -->
<style>
.backup-btn {
    background: #1565c0;
    color: white;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 16px;
    transition: 0.2s;
}
.backup-btn:hover  { background: #0d47a1; }
.backup-btn:active { transform: scale(0.97); }
.backup-btn:disabled { background: #90a4ae; cursor: not-allowed; }

.backup-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
.backup-table th {
    background: #004d40;
    color: white;
    padding: 10px 12px;
    text-align: left;
}
.backup-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
}
.backup-table tr:hover td { background: #f1f8e9; }
</style>

<!-- 5.  Script (paste before </body>) -->
<script>
// ── Manual Backup ──────────────────────────────────────────
async function takeManualBackup() {
    const btn  = document.getElementById('backup-btn');
    btn.disabled    = true;
    btn.textContent = '⏳ Backing up...';

    try {
        const res  = await fetch('/api/backup/manual', { method: 'POST' });
        const data = await res.json();

        if (data.success) {
            showBackupToast(`✅ Backup done! ${data.filename}  (${data.sizeKB} KB)`, '#2e7d32');
            loadBackupList();                       // refresh list if panel is open
        } else {
            showBackupToast('❌ Backup failed: ' + data.message, '#c62828');
        }
    } catch (err) {
        showBackupToast('❌ Error: ' + err.message, '#c62828');
    } finally {
        btn.disabled    = false;
        btn.textContent = '💾 Backup DB';
    }
}

// ── Toast notification ─────────────────────────────────────
function showBackupToast(msg, color) {
    const toast = document.getElementById('backup-toast');
    toast.textContent    = msg;
    toast.style.background = color;
    toast.style.display  = 'block';
    toast.style.opacity  = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 4000);
    setTimeout(() => { toast.style.display = 'none'; }, 4400);
}

// ── Show Backup History Panel ──────────────────────────────
function showBackupHistory() {
    const panel = document.getElementById('backup-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') loadBackupList();
}

// ── Load backup file list from server ─────────────────────
async function loadBackupList() {
    const container = document.getElementById('backup-list');
    if (!container) return;
    container.innerHTML = 'Loading...';

    try {
        const res  = await fetch('/api/backup/list');
        const data = await res.json();

        if (!data.backups.length) {
            container.innerHTML = '<p style="color:#888;">No backups found in E:\\Backup</p>';
            return;
        }

        let html = `<table class="backup-table">
            <thead><tr>
                <th>#</th>
                <th>Filename</th>
                <th>Size</th>
                <th>Created At</th>
            </tr></thead><tbody>`;

        data.backups.forEach((b, i) => {
            html += `<tr>
                <td>${i + 1}</td>
                <td style="font-family:monospace;">${b.filename}</td>
                <td>${b.sizeKB} KB</td>
                <td>${b.createdAt}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        html += `<p style="margin-top:12px; color:#888; font-size:13px;">
            📌 Backups older than 7 days are auto-deleted every day at 2:00 AM
        </p>`;
        container.innerHTML = html;

    } catch (err) {
        container.innerHTML = '<p style="color:red;">Failed to load backup list: ' + err.message + '</p>';
    }
}
</script>
