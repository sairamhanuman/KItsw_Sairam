<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Access Manager</title>
<script src="js/page-guard.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px;}
.page-wrap{max-width:1200px;margin:24px auto;padding:0 20px 60px;}

/* Toast */
#toast-container{position:fixed;bottom:28px;right:28px;display:flex;flex-direction:column-reverse;gap:10px;z-index:9999;pointer-events:none;}
.toast{min-width:280px;max-width:380px;padding:14px 18px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:flex-start;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);pointer-events:all;animation:toastIn .3s ease forwards;position:relative;overflow:hidden;}
.toast::after{content:'';position:absolute;bottom:0;left:0;height:3px;background:rgba(255,255,255,.4);animation:toastProgress 4s linear forwards;}
@keyframes toastIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{from{opacity:1;}to{opacity:0;transform:translateX(40px);}}
@keyframes toastProgress{from{width:100%;}to{width:0%;}}
.toast-success{background:#1b5e20;color:#fff;}.toast-error{background:#b71c1c;color:#fff;}.toast-info{background:#0d47a1;color:#fff;}
.toast-close{margin-left:auto;cursor:pointer;opacity:.7;font-size:16px;}

/* Header */
.page-header{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;padding:20px 28px;border-radius:10px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(26,35,126,.25);}
.page-header h1{font-size:20px;font-weight:700;}.page-header p{font-size:12px;opacity:.75;margin-top:3px;}
.back-link{color:#fff;text-decoration:none;font-size:13px;padding:7px 14px;border:1px solid rgba(255,255,255,.4);border-radius:6px;}
.back-link:hover{background:rgba(255,255,255,.15);}

/* Layout */
.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;}

/* User list */
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.08);}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#3949ab;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e8eaf6;}

.search-box{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:12px;}
.search-box:focus{outline:none;border-color:#3949ab;}

.user-list{display:flex;flex-direction:column;gap:6px;max-height:500px;overflow-y:auto;}
.user-item{padding:10px 12px;border-radius:6px;border:1.5px solid #e0e0e0;cursor:pointer;transition:all .15s;background:#fafafa;}
.user-item:hover{border-color:#3949ab;background:#f0f4ff;}
.user-item.active{border-color:#3949ab;background:#e8eaf6;}
.user-item-name{font-weight:600;font-size:13px;}
.user-item-meta{font-size:11px;color:#777;margin-top:2px;}
.role-chip{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-left:6px;}
.role-HOD{background:#e8eaf6;color:#3949ab;}.role-Faculty{background:#e8f5e9;color:#2e7d32;}
.role-Exam_Cell{background:#fff3e0;color:#e65100;}.role-Admin{background:#fce4ec;color:#880e4f;}
.role-Staff{background:#f3e5f5;color:#6a1b9a;}.role-Librarian{background:#e0f2f1;color:#00695c;}

/* Page access panel */
.access-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.selected-user-name{font-size:16px;font-weight:700;color:#1a237e;}
.selected-user-role{font-size:12px;color:#666;margin-top:2px;}

.module-section{margin-bottom:20px;}
.module-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#555;margin-bottom:10px;padding:8px 12px;background:#f5f5f5;border-radius:6px;display:flex;align-items:center;justify-content:space-between;}
.module-check-all{font-size:11px;font-weight:600;color:#3949ab;cursor:pointer;text-transform:none;letter-spacing:0;}
.module-check-all:hover{text-decoration:underline;}

.pages-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.page-checkbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:1.5px solid #e0e0e0;cursor:pointer;transition:all .15s;background:#fafafa;user-select:none;}
.page-checkbox:hover{border-color:#3949ab;background:#f0f4ff;}
.page-checkbox.checked{border-color:#3949ab;background:#e8eaf6;}
.page-checkbox input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:#3949ab;flex-shrink:0;}
.page-icon{font-size:16px;flex-shrink:0;}
.page-name{font-size:12px;font-weight:600;color:#333;}
.page-url{font-size:10px;color:#999;font-family:'Courier New',monospace;}

.action-bar{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #f0f0f0;}
.btn{padding:10px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:#3949ab;color:#fff;}.btn-primary:hover{background:#283593;}
.btn-outline{background:#fff;color:#3949ab;border:1.5px solid #3949ab;}.btn-outline:hover{background:#e8eaf6;}
.btn-success{background:#43a047;color:#fff;}.btn-success:hover{background:#2e7d32;}

.empty-state{text-align:center;padding:60px 20px;color:#aaa;}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* Stats bar */
.stats-bar{display:flex;gap:16px;margin-bottom:16px;padding:12px 16px;background:#f8f9ff;border-radius:8px;}
.stat-item{font-size:12px;font-weight:600;color:#555;}
.stat-item span{color:#3949ab;font-weight:700;}
</style>
</head>
<body>
<div id="toast-container"></div>

<div class="page-wrap">
    <div class="page-header">
        <div>
            <h1>🔐 Page Access Manager</h1>
            <p>Control which pages each user can access</p>
        </div>
        <a href="index.html" class="back-link">← Back to Dashboard</a>
    </div>

    <div class="layout">
        <!-- Left: User List -->
        <div class="card">
            <div class="card-title">👥 Users</div>
            <input type="text" class="search-box" placeholder="🔍 Search users..."
                oninput="filterUsers(this.value)">
            <div class="user-list" id="user-list">
                <p style="color:#aaa;text-align:center;padding:20px">Loading...</p>
            </div>
        </div>

        <!-- Right: Page Access Panel -->
        <div class="card" id="access-panel">
            <div class="empty-state">
                <div class="empty-icon">👈</div>
                <p>Select a user from the left to manage their page access</p>
            </div>
        </div>
    </div>
</div>

<script>
const SESSION = {
    userId:   localStorage.getItem('userId'),
    username: localStorage.getItem('username'),
    userRole: localStorage.getItem('userRole')
};

let allUsers   = [];
let allPages   = [];
let currentUser = null;
let checkedPages = new Set();

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, type='success') {
    const icons = {success:'✅',error:'❌',info:'ℹ️'};
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span style="flex:1">${msg}</span><span class="toast-close" onclick="this.parentElement.remove()">✕</span>`;
    c.appendChild(t);
    setTimeout(() => { t.style.animation='toastOut .3s ease forwards'; setTimeout(()=>t.remove(),300); }, 4000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    await Promise.all([loadUsers(), loadPages()]);
});

async function loadUsers() {
    try {
        const res  = await fetch('/api/users?limit=100');
        const data = await res.json();
        allUsers = (data.users || []).filter(u => u.user_role !== 'Admin');
        renderUserList(allUsers);
    } catch(err) {
        showToast('Failed to load users: '+err.message, 'error');
    }
}

async function loadPages() {
    try {
        const res  = await fetch('/api/page-access/pages');
        const data = await res.json();
        allPages = data.data || [];
    } catch(err) {
        showToast('Failed to load pages: '+err.message, 'error');
    }
}

function renderUserList(users) {
    const container = document.getElementById('user-list');
    if (!users.length) {
        container.innerHTML = '<p style="color:#aaa;text-align:center;padding:20px">No users found</p>';
        return;
    }
    container.innerHTML = users.map(u => `
        <div class="user-item${currentUser?.user_id === u.user_id ? ' active' : ''}"
            onclick="selectUser(${u.user_id})">
            <div class="user-item-name">
                ${u.username}
                <span class="role-chip role-${u.user_role}">${u.user_role}</span>
            </div>
            <div class="user-item-meta">${u.email}</div>
        </div>`).join('');
}

function filterUsers(q) {
    const filtered = allUsers.filter(u =>
        u.username.toLowerCase().includes(q.toLowerCase()) ||
        u.email.toLowerCase().includes(q.toLowerCase()) ||
        u.user_role.toLowerCase().includes(q.toLowerCase())
    );
    renderUserList(filtered);
}

async function selectUser(userId) {
    currentUser = allUsers.find(u => u.user_id === userId);
    if (!currentUser) return;

    // Highlight selected user
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');

    // Load user's current access
    try {
        const res  = await fetch(`/api/page-access/user/${userId}/all`);
        const data = await res.json();

        checkedPages = new Set(
            (data.data || []).filter(p => p.has_access).map(p => p.page_id)
        );

        renderAccessPanel(data.data || []);
    } catch(err) {
        showToast('Failed to load access: '+err.message, 'error');
    }
}

function renderAccessPanel(pages) {
    const panel = document.getElementById('access-panel');

    // Group by module
    const groups = {};
    pages.forEach(p => {
        if (!groups[p.module_group]) groups[p.module_group] = [];
        groups[p.module_group].push(p);
    });

    const totalChecked = checkedPages.size;
    const totalPages   = pages.length;

    let html = `
        <div class="access-header">
            <div>
                <div class="selected-user-name">🔐 ${currentUser.username}</div>
                <div class="selected-user-role">${currentUser.user_role} — ${currentUser.email}</div>
            </div>
            <button class="btn btn-outline" onclick="toggleAll()">
                ${checkedPages.size === totalPages ? '☐ Deselect All' : '☑ Select All'}
            </button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">Total Pages: <span>${totalPages}</span></div>
            <div class="stat-item">Granted: <span id="granted-count">${totalChecked}</span></div>
            <div class="stat-item">Blocked: <span id="blocked-count">${totalPages - totalChecked}</span></div>
        </div>`;

    Object.entries(groups).forEach(([group, groupPages]) => {
        const groupChecked = groupPages.filter(p => checkedPages.has(p.page_id)).length;
        html += `
        <div class="module-section">
            <div class="module-title">
                ${group} (${groupChecked}/${groupPages.length})
                <span class="module-check-all" onclick="toggleGroup('${group}', ${groupChecked < groupPages.length})">
                    ${groupChecked < groupPages.length ? '☑ Grant All' : '☐ Remove All'}
                </span>
            </div>
            <div class="pages-grid">
                ${groupPages.map(p => `
                <label class="page-checkbox${checkedPages.has(p.page_id) ? ' checked' : ''}"
                    id="label-${p.page_id}">
                    <input type="checkbox" id="page-${p.page_id}"
                        ${checkedPages.has(p.page_id) ? 'checked' : ''}
                        onchange="togglePage(${p.page_id}, this.checked)">
                    <span class="page-icon">${p.page_icon}</span>
                    <div>
                        <div class="page-name">${p.page_name}</div>
                        <div class="page-url">${p.page_url}</div>
                    </div>
                </label>`).join('')}
            </div>
        </div>`;
    });

    html += `
        <div class="action-bar">
            <button class="btn btn-primary" onclick="saveAccess()">💾 Save Access</button>
            <button class="btn btn-success" onclick="grantAllAndSave()">✅ Grant All & Save</button>
            <button class="btn btn-outline" onclick="revokeAll()">🚫 Revoke All</button>
        </div>`;

    panel.innerHTML = html;
}

function togglePage(pageId, checked) {
    if (checked) checkedPages.add(pageId);
    else checkedPages.delete(pageId);

    const label = document.getElementById(`label-${pageId}`);
    if (label) label.className = `page-checkbox${checked ? ' checked' : ''}`;

    updateStats();
}

function toggleGroup(group, grantAll) {
    allPages.filter(p => p.module_group === group).forEach(p => {
        const cb = document.getElementById(`page-${p.page_id}`);
        if (cb) {
            cb.checked = grantAll;
            togglePage(p.page_id, grantAll);
        }
    });
    // Re-render to update group counts
    renderAccessPanel(allPages.map(p => ({ ...p, has_access: checkedPages.has(p.page_id) ? 1 : 0 })));
}

function toggleAll() {
    const allChecked = checkedPages.size === allPages.length;
    allPages.forEach(p => {
        if (allChecked) checkedPages.delete(p.page_id);
        else checkedPages.add(p.page_id);
    });
    renderAccessPanel(allPages.map(p => ({ ...p, has_access: checkedPages.has(p.page_id) ? 1 : 0 })));
}

function updateStats() {
    const el = document.getElementById('granted-count');
    const el2 = document.getElementById('blocked-count');
    if (el)  el.textContent  = checkedPages.size;
    if (el2) el2.textContent = allPages.length - checkedPages.size;
}

function revokeAll() {
    checkedPages.clear();
    renderAccessPanel(allPages.map(p => ({ ...p, has_access: 0 })));
}

async function grantAllAndSave() {
    allPages.forEach(p => checkedPages.add(p.page_id));
    await saveAccess();
}

async function saveAccess() {
    if (!currentUser) { showToast('Select a user first', 'error'); return; }

    try {
        const res  = await fetch(`/api/page-access/user/${currentUser.user_id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                page_ids:   [...checkedPages],
                granted_by: SESSION.userId
            })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        showToast(`✅ Access saved for ${currentUser.username} — ${checkedPages.size} pages granted`, 'success');
        renderAccessPanel(allPages.map(p => ({ ...p, has_access: checkedPages.has(p.page_id) ? 1 : 0 })));
    } catch(err) {
        showToast('Error: '+err.message, 'error');
    }
}
</script>
</body>
</html>
