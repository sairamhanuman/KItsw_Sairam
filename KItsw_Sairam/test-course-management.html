<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/main.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <h2>Course Management Test</h2>
        
        <div class="row">
            <div class="col-md-6">
                <h3>API Test Results</h3>
                <div id="apiResults"></div>
            </div>
            <div class="col-md-6">
                <h3>Dropdown Test</h3>
                <div>
                    <label for="testSemester">Semester:</label>
                    <select id="testSemester" class="form-select">
                        <option value="">Loading...</option>
                    </select>
                </div>
                <div class="mt-3">
                    <label for="testProgramme">Programme:</label>
                    <select id="testProgramme" class="form-select">
                        <option value="">Loading...</option>
                    </select>
                </div>
                <div class="mt-3">
                    <label for="testBranch">Branch:</label>
                    <select id="testBranch" class="form-select">
                        <option value="">Loading...</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Test all APIs
        async function testAllAPIs() {
            const results = document.getElementById('apiResults');
            let html = '<h4>API Test Results:</h4>';
            
            try {
                // Test semesters
                const semesterResponse = await fetch('http://localhost:3000/api/semesters');
                const semesters = await semesterResponse.json();
                html += `<p>✅ Semesters: ${semesters.data.length} items</p>`;
                
                // Test programmes
                const programmeResponse = await fetch('http://localhost:3000/api/programmes');
                const programmes = await programmeResponse.json();
                html += `<p>✅ Programmes: ${programmes.data.length} items</p>`;
                
                // Test branches
                const branchResponse = await fetch('http://localhost:3000/api/branches');
                const branches = await branchResponse.json();
                html += `<p>✅ Branches: ${branches.data.length} items</p>`;
                
                // Test regulations
                const regulationResponse = await fetch('http://localhost:3000/api/regulations');
                const regulations = await regulationResponse.json();
                html += `<p>✅ Regulations: ${regulations.data.length} items</p>`;
                
                // Test subjects
                const subjectResponse = await fetch('http://localhost:3000/api/subjects');
                const subjects = await subjectResponse.json();
                html += `<p>✅ Subjects: ${subjects.data.length} items</p>`;
                
                // Test sample excel
                const sampleResponse = await fetch('http://localhost:3000/api/subjects/sample-excel?programme_id=1&branch_id=7&semester_id=4');
                const sample = await sampleResponse.json();
                html += `<p>✅ Sample Excel: ${sample.status}</p>`;
                
                // Fill dropdowns
                const semesterSelect = document.getElementById('testSemester');
                semesterSelect.innerHTML = '<option value="">Select Semester</option>';
                semesters.data.forEach(semester => {
                    const option = new Option(`Semester ${semester.semester_number}`, semester.semester_id);
                    semesterSelect.add(option);
                });
                
                const programmeSelect = document.getElementById('testProgramme');
                programmeSelect.innerHTML = '<option value="">Select Programme</option>';
                programmes.data.forEach(programme => {
                    const option = new Option(programme.programme_name, programme.programme_id);
                    programmeSelect.add(option);
                });
                
                const branchSelect = document.getElementById('testBranch');
                branchSelect.innerHTML = '<option value="">Select Branch</option>';
                branches.data.forEach(branch => {
                    const option = new Option(branch.branch_name, branch.branch_id);
                    branchSelect.add(option);
                });
                
                html += '<h5 style="color: green;">✅ All APIs working correctly!</h5>';
                
            } catch (error) {
                console.error('Error:', error);
                html += `<h5 style="color: red;">❌ Error: ${error.message}</h5>`;
            }
            
            results.innerHTML = html;
        }
        
        // Run test on page load
        window.onload = testAllAPIs;
    </script>
</body>
</html>
